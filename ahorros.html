<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ahorros">
<meta name="theme-color" content="#070d18">
<title>Ahorros</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,400;1,700&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg:      #070d18;
  --card:    #0d1a2b;
  --card2:   #112235;
  --border:  rgba(255,255,255,0.07);
  --gold:    #f0b429;
  --teal:    #00d4aa;
  --blue:    #4d9fff;
  --orange:  #ff7b3a;
  --purple:  #a78bfa;
  --pink:    #f472b6;
  --red:     #ff5f5f;
  --text:    #e8f0fe;
  --muted:   rgba(255,255,255,0.35);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;overflow:hidden;}

/* ── Layout ── */
.root{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform .32s cubic-bezier(.4,0,.2,1),opacity .32s;}
.screen.off{transform:translateX(105%);opacity:0;pointer-events:none;}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
.pad{padding:0 18px;}

/* ── Nav Bar ── */
.nav{
display:flex;align-items:center;
background:var(–card);
border-top:1px solid var(–border);
padding:8px 12px calc(8px + var(–safe-bot));
gap:6px;
flex-shrink:0;
}
.nav-btn{
flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
background:none;border:none;color:var(–muted);
font-family:‘DM Mono’,monospace;font-size:9px;letter-spacing:.05em;
cursor:pointer;padding:6px 2px;border-radius:14px;position:relative;
transition:color .2s;
}
.nav-btn.active{color:#fff;}
.nav-icon-wrap{
width:42px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;
transition:background .2s,transform .15s;
}
.nav-btn.active .nav-icon-wrap{transform:scale(1.05);}
.nav-btn:nth-child(1).active .nav-icon-wrap{background:rgba(240,180,41,0.22);box-shadow:0 0 14px rgba(240,180,41,0.25);}
.nav-btn:nth-child(2).active .nav-icon-wrap{background:rgba(0,212,170,0.22);box-shadow:0 0 14px rgba(0,212,170,0.25);}
.nav-btn:nth-child(4).active .nav-icon-wrap{background:rgba(160,130,250,0.22);box-shadow:0 0 14px rgba(160,130,250,0.25);}
.nav-add{
width:52px;height:52px;border-radius:18px;border:none;cursor:pointer;
background:linear-gradient(135deg,var(–blue),var(–purple));
display:flex;align-items:center;justify-content:center;
box-shadow:0 4px 20px rgba(77,159,255,0.4);
transition:transform .15s,box-shadow .15s;flex-shrink:0;
}
.nav-add:active{transform:scale(.93);box-shadow:0 2px 10px rgba(77,159,255,0.3);}
.nav-badge{
position:absolute;top:2px;right:6px;
background:var(–teal);color:#070d18;
border-radius:50%;width:16px;height:16px;
font-size:10px;font-weight:700;
display:flex;align-items:center;justify-content:center;
}

/* ── Cards ── */
.card{background:var(–card);border:1px solid var(–border);border-radius:20px;padding:18px 16px;margin-bottom:12px;}
.card-accent{position:relative;overflow:hidden;}
.card-accent::before{content:’’;position:absolute;top:0;left:0;right:0;height:2px;border-radius:20px 20px 0 0;}

/* ── Typography ── */
.page-label{font-size:9px;letter-spacing:.2em;color:var(–muted);text-transform:uppercase;margin-bottom:5px;}
.page-title{font-family:‘Playfair Display’,serif;font-style:italic;font-size:34px;line-height:1.1;margin-bottom:0;}
.section-title{font-family:‘Playfair Display’,serif;font-style:italic;font-size:20px;margin-bottom:12px;}
.label{font-size:9px;letter-spacing:.14em;color:var(–muted);text-transform:uppercase;margin-bottom:4px;}

/* ── Big number ── */
.bignum{display:inline-flex;align-items:baseline;gap:1px;}
.bignum-sym{font-size:.5em;color:var(–muted);margin-right:1px;}
.bignum-int{font-family:‘Playfair Display’,serif;font-weight:800;letter-spacing:-.02em;}
.bignum-dec{font-family:‘Playfair Display’,serif;font-weight:600;}

/* ── Progress bar ── */
.progbar-wrap{background:rgba(255,255,255,0.07);border-radius:8px;height:8px;overflow:hidden;}
.progbar-fill{height:100%;border-radius:8px;transition:width .8s ease;}

/* ── Product card ── */
.prod-card{background:var(–card);border-radius:18px;padding:16px;margin-bottom:10px;cursor:pointer;border:1px solid var(–border);border-left-width:3px;transition:transform .1s;}
.prod-card:active{transform:scale(.99);}
.prod-divider{height:1px;background:rgba(255,255,255,0.05);margin:10px 0;}

/* ── Movement item ── */
.mov-item{display:flex;align-items:center;gap:10px;padding:11px 13px;background:rgba(255,255,255,0.03);border-radius:13px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.04);}
.mov-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}

/* ── Alert banner ── */
.alert-banner{border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:10px;}

/* ── Back button ── */
.back-btn{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.09);color:rgba(255,255,255,0.7);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:12px;font-family:‘DM Mono’,monospace;margin-bottom:20px;}

/* ── Form inputs ── */
.inp{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:11px;color:white;padding:12px 14px;font-size:14px;width:100%;font-family:‘DM Mono’,monospace;outline:none;display:block;margin-bottom:0;}
.inp:focus{border-color:rgba(255,255,255,0.25);}
.form-group{display:flex;flex-direction:column;gap:12px;}
.form-label{font-size:11px;color:var(–muted);margin-bottom:5px;}

/* ── Stat chips ── */
.stat-chip{background:rgba(255,255,255,0.04);border-radius:13px;padding:11px 10px;text-align:center;}

/* ── Btn ── */
.btn{border:none;border-radius:13px;padding:14px;font-size:14px;font-weight:700;font-family:‘DM Mono’,monospace;cursor:pointer;width:100%;}
.btn-gold{background:linear-gradient(135deg,#f0b429,#e09010);color:#070d18;}
.btn-teal{background:linear-gradient(135deg,#00d4aa,#00a880);color:#070d18;}
.btn-blue{background:rgba(77,159,255,0.15);border:1px solid rgba(77,159,255,0.3);color:var(–blue);}
.btn-red{background:rgba(255,95,95,0.08);border:1px solid rgba(255,95,95,0.2);color:var(–red);}
.btn-dashed{background:rgba(255,255,255,0.04);border:1px dashed rgba(255,255,255,0.14);color:var(–muted);border-radius:11px;}

/* ── Color dots ── */
.color-dot{width:32px;height:32px;border-radius:50%;cursor:pointer;transition:transform .15s;border:3px solid transparent;}
.color-dot.sel{border-color:white;transform:scale(1.1);}

/* ── Chart container ── */
.chart-wrap{position:relative;width:100%;}

/* ── Proj diff row ── */
.diff-row{display:flex;overflow-x:auto;gap:4px;padding:10px 0 2px;}
.diff-cell{flex-shrink:0;text-align:center;min-width:30px;}

/* ── Header gradient blob ── */
.header-blob{position:absolute;top:-60px;right:-40px;width:200px;height:200px;border-radius:50%;opacity:.06;pointer-events:none;}

/* ── Plan edit row ── */
.plan-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.plan-mo{width:56px;font-size:11px;color:var(–muted);flex-shrink:0;}
.plan-pct{width:46px;text-align:right;flex-shrink:0;}

/* ── Scrollbar hide ── */
::-webkit-scrollbar{width:0;height:0;}
</style>

</head>
<body>
<div class="root" id="app"></div>

<script>
// ─── DATA ─────────────────────────────────────────────────────────────────────
const TAX = 0.19;
const MES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

const DATA0 = {
  products:[
    {id:"p1",name:"MyInvestor Premium 1m",type:"deposit",color:"#f0b429",rate:4,startDate:"2026-04-09",maturityDate:"",reminder:false,
      movements:[{id:"m1",type:"contribution",amount:5000,date:"2026-04-09",note:"Apertura"},{id:"m2",type:"interest",amount:16.44,date:"2026-05-09",note:"Vencimiento"}]},
    {id:"p2",name:"MyInvestor Premium 3m",type:"deposit",color:"#00d4aa",rate:3,startDate:"2026-03-09",maturityDate:"2026-06-09",reminder:true,
      movements:[{id:"m3",type:"contribution",amount:25000,date:"2026-03-09",note:"Apertura"}]},
    {id:"p3",name:"Trade Republic",type:"savings",color:"#4d9fff",rate:2,startDate:"2026-05-01",maturityDate:"",reminder:false,
      movements:[{id:"m4",type:"contribution",amount:1100,date:"2026-04-29",note:""},{id:"m5",type:"contribution",amount:1906.49,date:"2026-05-14",note:""}]},
    {id:"p4",name:"ING",type:"savings",color:"#ff7b3a",rate:0,startDate:"2026-05-01",maturityDate:"",reminder:false,
      movements:[{id:"m6",type:"contribution",amount:403,date:"2026-05-09",note:""}]}
  ],
  goal:{name:"Entrada vivienda",target:60000,monthlyPlan:[
    {month:"2026-01",amount:0},{month:"2026-02",amount:0},{month:"2026-03",amount:25000},
    {month:"2026-04",amount:6100},{month:"2026-05",amount:2309.49},{month:"2026-06",amount:1000},
    {month:"2026-07",amount:1000},{month:"2026-08",amount:800},{month:"2026-09",amount:1000},
    {month:"2026-10",amount:1000},{month:"2026-11",amount:1000},{month:"2026-12",amount:800}
  ]}
};

let state = JSON.parse(JSON.stringify(DATA0));

// ─── UTILS ────────────────────────────────────────────────────────────────────
const toNet   = g => g*(1-TAX);
const fmt     = (n,d=2)=>new Intl.NumberFormat("es-ES",{minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
const fmtDate = d=>d?new Date(d+"T12:00:00").toLocaleDateString("es-ES",{day:"2-digit",month:"short",year:"2-digit"}):"—";
const fmtSh   = d=>d?new Date(d+"T12:00:00").toLocaleDateString("es-ES",{day:"2-digit",month:"short"}):"";
const todayS  = ()=>new Date().toISOString().split("T")[0];
const todayM  = ()=>new Date().toISOString().slice(0,7);
const todayD  = ()=>new Date().toLocaleDateString("es-ES",{day:"numeric",month:"short"}).toUpperCase();
const daysUntil= ds=>ds?Math.ceil((new Date(ds+"T12:00:00")-new Date())/86400000):null;
const moSh    = mo=>{const[,m]=mo.split("-");return MES[+m-1];};
const moLbl   = mo=>{const[y,m]=mo.split("-");return `${MES[+m-1]} ${y}`;};

const getBal     = p=>p.movements.reduce((a,m)=>a+(m.type==="contribution"?m.amount:m.type==="withdrawal"?-m.amount:toNet(m.amount)),0);
const getNetI    = p=>p.movements.filter(m=>m.type==="interest").reduce((s,m)=>s+toNet(m.amount),0);
const getGrossI  = p=>p.movements.filter(m=>m.type==="interest").reduce((s,m)=>s+m.amount,0);
const getContrib = p=>p.movements.filter(m=>m.type==="contribution"||m.type==="withdrawal").reduce((s,m)=>s+(m.type==="contribution"?m.amount:-m.amount),0);

function getProjNet(p){
  if(p.type!=="deposit"||!p.maturityDate||!p.rate) return null;
  const days=(new Date(p.maturityDate+"T12:00:00")-new Date(p.startDate+"T12:00:00"))/86400000;
  return toNet(getContrib(p)*(p.rate/100)*(days/365));
}

// Interés acumulado estimado para cuentas de ahorro (Trade Republic, etc.)
// Calcula el interés generado hasta hoy según el saldo diario. Bruto.
function getAccruedSavingsGross(p){
  if(p.type!=="savings"||!p.rate) return null;
  // ordenar movimientos por fecha
  const movs=[...p.movements].filter(m=>m.type==="contribution"||m.type==="withdrawal")
    .sort((a,b)=>a.date.localeCompare(b.date));
  if(!movs.length) return 0;
  const today=new Date();
  let balance=0, accrued=0, prevDate=null;
  movs.forEach(m=>{
    const mDate=new Date(m.date+"T12:00:00");
    if(prevDate){
      const days=Math.max(0,(mDate-prevDate)/86400000);
      accrued+=balance*(p.rate/100)*(days/365);
    }
    balance+=m.type==="contribution"?m.amount:-m.amount;
    prevDate=mDate;
  });
  // tramo desde el último movimiento hasta hoy
  if(prevDate){
    const days=Math.max(0,(today-prevDate)/86400000);
    accrued+=balance*(p.rate/100)*(days/365);
  }
  return accrued;
}
// Interés de ahorro a mostrar: override manual si existe, si no el estimado. Neto.
function getSavingsInterestNet(p){
  if(p.type!=="savings"||!p.rate) return null;
  if(p.manualInterest!=null&&p.manualInterest!=="") return toNet(parseFloat(p.manualInterest));
  const g=getAccruedSavingsGross(p);
  return g==null?null:toNet(g);
}

// ─── RENDER ENGINE ────────────────────────────────────────────────────────────
let chartInstances = {};
function destroyCharts(){Object.values(chartInstances).forEach(c=>{try{c.destroy();}catch(e){}});chartInstances={};}

function h(tag,attrs={},children=[]){
  const el=document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==="class") el.className=v;
    else if(k==="style"&&typeof v==="object") Object.assign(el.style,v);
    else if(k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(),v);
    else el.setAttribute(k,v);
  });
  children.forEach(c=>{
    if(c==null||c===false) return;
    el.appendChild(typeof c==="string"?document.createTextNode(c):c);
  });
  return el;
}

function bigNum(value,color="white",mainSz=42,decSz=22){
  const abs=Math.abs(value), sign=value<0?"-":"";
  const str=fmt(abs), [int,cents]=str.split(",");
  const wrap=h("span",{class:"bignum"});
  wrap.innerHTML=`<span class="bignum-sym" style="font-size:${mainSz*.5}px;color:rgba(255,255,255,0.4)">€</span><span class="bignum-int" style="font-size:${mainSz}px;color:${color}">${sign}${int}</span><span class="bignum-dec" style="font-size:${decSz}px;color:${color==="white"?"rgba(255,255,255,0.45)":color+"88"}">,${cents}</span>`;
  return wrap;
}

function progBar(value,max,color="#f0b429",h_=8){
  const pct=Math.min((value/max)*100,100);
  return h("div",{class:"progbar-wrap",style:{height:h_+"px"}},[
    h("div",{class:"progbar-fill",style:{width:pct+"%",background:`linear-gradient(90deg,${color}cc,${color})`,boxShadow:`0 0 10px ${color}44`}})
  ]);
}

// ─── NAV ─────────────────────────────────────────────────────────────────────
let currentTab="home";
let currentScr="main";
let selectedId=null;

function renderNav(){
  const badge=state.products.filter(p=>p.reminder&&p.maturityDate&&daysUntil(p.maturityDate)>0).length;
  const nav=h("div",{class:"nav"});

  const tabs=[
    {id:"home",  label:"Inicio",  color:"#f0b429", icon:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>`},
    {id:"vencim",label:"Vencim.", color:"#00d4aa", icon:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>`},
    {id:"backup",label:"Backup",  color:"#a78bfa", icon:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>`},
  ];

  tabs.forEach((t,i)=>{
    const active=currentTab===t.id&&currentScr==="main";
    const btn=h("button",{class:"nav-btn"+(active?" active":""),onclick:()=>{currentTab=t.id;currentScr="main";render();}});
    const wrap=h("div",{class:"nav-icon-wrap",style:{background:active?`${t.color}22`:"transparent",boxShadow:active?`0 0 14px ${t.color}33`:"none"}});
    wrap.innerHTML=t.icon;
    if(active) wrap.querySelector("svg").style.stroke=t.color;
    btn.appendChild(wrap);
    btn.appendChild(document.createTextNode(t.label));
    if(t.id==="vencim"&&badge>0){
      const bdg=h("div",{class:"nav-badge"},[""+badge]);
      btn.appendChild(bdg);
    }
    // insert add button between vencim and backup
    if(i===1){
      nav.appendChild(btn);
      const add=h("button",{class:"nav-add",onclick:()=>{currentScr="addProd";render();}});
      add.innerHTML=`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
      nav.appendChild(add);
    } else {
      nav.appendChild(btn);
    }
  });
  return nav;
}

// ─── HOME ─────────────────────────────────────────────────────────────────────
function renderHome(){
  const ps=state.products;
  const totalNet=ps.reduce((s,p)=>s+getBal(p),0);
  const totalCon=ps.reduce((s,p)=>s+getContrib(p),0);
  const totalNetI=ps.reduce((s,p)=>s+getNetI(p),0);
  const totalGrossI=ps.reduce((s,p)=>s+getGrossI(p),0);
  const goalPct=(totalNet/state.goal.target)*100;
  const alerts=ps.filter(p=>p.reminder&&p.maturityDate&&daysUntil(p.maturityDate)>0);

  // Prev month
  const cut=new Date(); cut.setMonth(cut.getMonth()-1);
  const cs=cut.toISOString().split("T")[0];
  let prevMo=0; ps.forEach(p=>p.movements.forEach(m=>{if(m.date<=cs)prevMo+=m.type==="contribution"?m.amount:m.type==="withdrawal"?-m.amount:toNet(m.amount);}));
  const growthMo=prevMo>0?(totalNet-prevMo)/prevMo*100:null;
  const allDates=ps.flatMap(p=>p.movements.map(m=>m.date)).sort();
  const firstDate=allDates[0]||null;

  const scrl=h("div",{class:"scroll"});

  // Header
  const hdr=h("div",{style:{padding:"calc(20px + var(--safe-top)) 20px 0",position:"relative",overflow:"hidden"}});
  const blob=h("div",{class:"header-blob",style:{background:"radial-gradient(circle,#f0b429,transparent)",top:"-60px",right:"-40px"}});
  const blob2=h("div",{class:"header-blob",style:{background:"radial-gradient(circle,#4d9fff,transparent)",top:"20px",right:"60px",width:"150px",height:"150px"}});
  hdr.appendChild(blob); hdr.appendChild(blob2);
  hdr.appendChild(h("div",{class:"page-label"},["Patrimonio"]));
  const title=h("div",{class:"page-title"});
  title.innerHTML=`<span style="color:white">Mis </span><span style="color:#f0b429">Ahorros</span>`;
  const dateChip=h("div",{style:{position:"absolute",top:"calc(22px + var(--safe-top))",right:"20px",background:"rgba(255,255,255,0.08)",borderRadius:"20px",padding:"5px 13px",fontSize:"11px",color:"rgba(255,255,255,0.5)"}},[todayD()]);
  hdr.appendChild(title); hdr.appendChild(dateChip);
  scrl.appendChild(hdr);

  const padDiv=h("div",{class:"pad"});

  // Alerts
  alerts.forEach(p=>{
    const d=daysUntil(p.maturityDate);
    const a=h("div",{class:"alert-banner",style:{background:`${p.color}14`,border:`1px solid ${p.color}30`,marginTop:"14px"},onclick:()=>{selectedId=p.id;currentScr="product";render();}});
    const ico=h("div",{style:{width:"38px",height:"38px",background:`${p.color}22`,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:"0",fontSize:"18px"}},["🔔"]);
    const txt=h("div",{style:{flex:"1"}});
    txt.appendChild(h("div",{style:{fontSize:"13px",fontWeight:"700"}},[p.name]));
    txt.appendChild(h("div",{style:{fontSize:"11px",color:"rgba(255,255,255,0.45)",marginTop:"3px"}},["Vence en "+d+" días"]));
    const dot=h("div",{style:{width:"9px",height:"9px",background:p.color,borderRadius:"50%",flexShrink:"0"}});
    a.appendChild(ico); a.appendChild(txt); a.appendChild(dot);
    padDiv.appendChild(a);
  });

  // Total card
  const tc=h("div",{class:"card",style:{marginTop:"16px",background:"linear-gradient(145deg,#152030,#0d1a2b)"}});
  tc.appendChild(h("div",{class:"label"},["Total acumulado"]));
  const bnWrap=h("div",{style:{margin:"6px 0 0"}});
  bnWrap.appendChild(bigNum(totalNet,"white",48,26));
  tc.appendChild(bnWrap);
  const div1=h("div",{style:{height:"1px",background:"rgba(255,255,255,0.06)",margin:"14px 0"}});
  tc.appendChild(div1);

    col.appendChild(h("div",{style:{fontSize:"13px",fontWeight:"700",color:c.col}},[c.val]));
    if(c.sub) col.appendChild(h("div",{style:{fontSize:"8px",color:"rgba(255,255,255,0.2)"}},[c.sub]));
    g3.appendChild(col);
  });
  bc.appendChild(g3);
  if(pj){
    bc.appendChild(h("div",{style:{height:"1px",background:"rgba(255,255,255,0.05)",margin:"12px 0"}}));
    const pr=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}});
    pr.appendChild(h("span",{style:{fontSize:"11px",color:"rgba(255,255,255,0.35)"}},["Proyección al vencimiento (neto)"]));
    pr.appendChild(h("span",{style:{fontSize:"14px",fontWeight:"700",color:"#00d4aa"}},["+€"+fmt(pj)]));
    bc.appendChild(pr);
  }
  // Interés de ahorro (cuentas tipo Trade Republic)
  const accNet=getSavingsInterestNet(p);
  if(accNet!=null){
    const accGross=getAccruedSavingsGross(p);
    const accManual=p.manualInterest!=null&&p.manualInterest!=="";
    bc.appendChild(h("div",{style:{height:"1px",background:"rgba(255,255,255,0.05)",margin:"12px 0"}}));
    const ar=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}});
    const arl=h("div");
    arl.appendChild(h("div",{style:{fontSize:"11px",color:"rgba(255,255,255,0.35)"}},[accManual?"Interés introducido (neto)":"Interés acumulado estimado (neto)"]));
    arl.appendChild(h("div",{style:{fontSize:"9px",color:"rgba(255,255,255,0.22)",marginTop:"2px"}},[accManual?"valor manual · -19% IRPF":"bruto €"+fmt(accGross||0)+" · "+p.rate+"% TAE · -19%"]));
    ar.appendChild(arl);
    ar.appendChild(h("span",{style:{fontSize:"14px",fontWeight:"700",color:"#00d4aa"}},["+€"+fmt(accNet)]));
    bc.appendChild(ar);
    // Botón para ajustar manualmente
    const adjBtn=h("button",{style:{width:"100%",marginTop:"10px",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",color:"rgba(255,255,255,0.6)",borderRadius:"9px",padding:"8px",fontSize:"11px",fontFamily:"'DM Mono',monospace",cursor:"pointer"},onclick:()=>{currentScr="editInterest";render();}});
    adjBtn.textContent=accManual?"✎ Editar interés manual":"✎ Introducir interés manualmente";
    bc.appendChild(adjBtn);
  }
  hdr.appendChild(bc); scrl.appendChild(hdr);

  // Movements
  const mv=h("div",{style:{padding:"0 18px"}});
  const mh=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}});
  mh.appendChild(h("div",{style:{fontSize:"14px",fontWeight:"600"}},["Movimientos"]));
  const addMovBtn=h("button",{style:{background:p.color,border:"none",color:"#070d18",borderRadius:"10px",padding:"7px 14px",cursor:"pointer",fontSize:"12px",fontWeight:"700",display:"flex",alignItems:"center",gap:"5px",fontFamily:"'DM Mono',monospace"},onclick:()=>{currentScr="addMov";render();}});
  addMovBtn.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Añadir`;
  mh.appendChild(addMovBtn); mv.appendChild(mh);
  [...p.movements].reverse().forEach(m=>{
    const isI=m.type==="interest", isW=m.type==="withdrawal";
    const disp=isI?toNet(m.amount):m.amount;
    const mi=h("div",{class:"mov-item"});
    const ico=h("div",{class:"mov-icon",style:{background:isI?"rgba(0,212,170,0.13)":isW?"rgba(255,95,95,0.13)":"rgba(77,159,255,0.1)"}},[isI?"%":isW?"↓":"↑"]);
    const txt=h("div",{style:{flex:"1",minWidth:"0"}});
    txt.appendChild(h("div",{style:{fontSize:"12px",fontWeight:"600"}},[m.type==="contribution"?"Aportación":m.type==="interest"?"Intereses":"Retirada"+(m.note?" · "+m.note:"")]));
    txt.appendChild(h("div",{style:{fontSize:"10px",color:"rgba(255,255,255,0.28)",marginTop:"2px"}},[fmtDate(m.date)]));
    if(isI) txt.appendChild(h("div",{style:{fontSize:"9px",color:"rgba(255,255,255,0.2)",marginTop:"1px"}},["Bruto €"+fmt(m.amount)+" · -19% IRPF"]));
    const amt=h("div",{style:{textAlign:"right"}});
    amt.appendChild(h("div",{style:{fontSize:"14px",fontWeight:"700",color:isW?"#ff5f5f":isI?"#00d4aa":"white"}},[(isW?"-":"+"+"€"+fmt(disp))]));
    if(isI) amt.appendChild(h("div",{style:{fontSize:"9px",color:"rgba(255,255,255,0.22)"}},["neto"]));
    const del=h("button",{style:{background:"none",border:"none",color:"rgba(255,255,255,0.15)",cursor:"pointer",padding:"4px",flexShrink:"0"},onclick:()=>{p.movements=p.movements.filter(x=>x.id!==m.id);render();}});
    del.innerHTML=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>`;
    mi.appendChild(ico); mi.appendChild(txt); mi.appendChild(amt); mi.appendChild(del);
    mv.appendChild(mi);
  });
  mv.appendChild(h("div",{style:{height:"14px"}}));
  const delBtn=h("button",{class:"btn btn-red",onclick:()=>{if(confirm("¿Eliminar este producto?")){state.products=state.products.filter(x=>x.id!==selectedId);currentScr="main";render();}}},["Eliminar producto"]);
  mv.appendChild(delBtn); mv.appendChild(h("div",{style:{height:"22px"}}));
  scrl.appendChild(mv);
  return scrl;
}

// ─── ADD PRODUCT ──────────────────────────────────────────────────────────────
function renderAddProd(){
  let f={name:"",type:"savings",rate:"",color:"#4d9fff",startDate:todayS(),maturityDate:""};
  let amt="";
  const COLORS=["#4d9fff","#00d4aa","#f0b429","#ff7b3a","#a78bfa","#f472b6"];
  const scrl=h("div",{class:"scroll",style:{padding:"calc(20px + var(--safe-top)) 18px 0"}});
  const back=h("button",{class:"back-btn",onclick:()=>{currentScr="main";render();}});
  back.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg> Volver`;
  scrl.appendChild(back);
  scrl.appendChild(h("div",{style:{fontFamily:"'Playfair Display',serif",fontStyle:"italic",fontSize:"26px",marginBottom:"20px"}},["Nuevo producto"]));

  const nameI=h("input",{class:"inp",placeholder:"Nombre",value:f.name});
  nameI.oninput=e=>f.name=e.target.value;
  const typeS=h("select",{class:"inp"});
  [{v:"savings",l:"Cuenta ahorro"},{v:"deposit",l:"Depósito"}].forEach(o=>{const opt=h("option",{value:o.v},[o.l]);if(o.v===f.type)opt.selected=true;typeS.appendChild(opt);});
  typeS.onchange=e=>{f.type=e.target.value;renderMatInput();};
  const rateI=h("input",{class:"inp",type:"number",placeholder:"TAE %",value:f.rate});
  rateI.oninput=e=>f.rate=e.target.value;
  const amtI=h("input",{class:"inp",type:"number",placeholder:"Importe inicial (€)",value:amt});
  amtI.oninput=e=>amt=e.target.value;
  const startL=h("div"); startL.appendChild(h("div",{class:"form-label"},["Fecha apertura"]));
  const startI=h("input",{class:"inp",type:"date",value:f.startDate}); startI.oninput=e=>f.startDate=e.target.value;
  startL.appendChild(startI);
  const matWrap=h("div");
  function renderMatInput(){
    matWrap.innerHTML="";
    if(f.type==="deposit"){
      const ml=h("div"); ml.appendChild(h("div",{class:"form-label"},["Fecha vencimiento"]));
      const mi=h("input",{class:"inp",type:"date",value:f.maturityDate}); mi.oninput=e=>f.maturityDate=e.target.value;
      ml.appendChild(mi); matWrap.appendChild(ml);
    }
  }
  renderMatInput();
  const colorWrap=h("div");
  colorWrap.appendChild(h("div",{class:"form-label"},["Color"]));
  const dots=h("div",{style:{display:"flex",gap:"10px",marginTop:"2px"}});
  COLORS.forEach(c=>{
    const dot=h("div",{class:"color-dot"+(f.color===c?" sel":""),style:{background:c},onclick:()=>{f.color=c;dots.querySelectorAll(".color-dot").forEach(d=>d.classList.remove("sel"));dot.classList.add("sel");}});
    dots.appendChild(dot);
  });
  colorWrap.appendChild(dots);
  const saveBtn=h("button",{class:"btn btn-gold",style:{marginTop:"8px"},onclick:()=>{
    if(!f.name) return;
    state.products.push({id:"p"+Date.now(),...f,rate:parseFloat(f.rate)||0,reminder:false,movements:amt?[{id:"m"+Date.now(),type:"contribution",amount:parseFloat(amt),date:f.startDate,note:"Apertura"}]:[]});
    currentScr="main"; render();
  }},["Guardar producto"]);

  [nameI,typeS,rateI,amtI,startL,matWrap,colorWrap,saveBtn,h("div",{style:{height:"22px"}})].forEach(el=>scrl.appendChild(el));
  return scrl;
}

// ─── ADD MOVEMENT ─────────────────────────────────────────────────────────────
function renderAddMov(){
  const p=state.products.find(x=>x.id===selectedId);
  if(!p) return h("div",{},[]);
  let f={type:"contribution",amount:"",date:todayS(),note:""};
  const scrl=h("div",{class:"scroll",style:{padding:"calc(20px + var(--safe-top)) 18px 0"}});
  const back=h("button",{class:"back-btn",onclick:()=>{currentScr="product";render();}});
  back.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg> Volver`;
  scrl.appendChild(back);
  scrl.appendChild(h("div",{style:{fontFamily:"'Playfair Display',serif",fontStyle:"italic",fontSize:"24px",marginBottom:"4px"}},["Nuevo movimiento"]));
  scrl.appendChild(h("div",{style:{fontSize:"12px",color:"rgba(255,255,255,0.38)",marginBottom:"20px"}},[p.name]));

  const typeS=h("select",{class:"inp"});
  [{v:"contribution",l:"Aportación"},{v:"withdrawal",l:"Retirada"},{v:"interest",l:"Intereses (bruto)"}].forEach(o=>{const opt=h("option",{value:o.v},[o.l]);typeS.appendChild(opt);});
  typeS.onchange=e=>{f.type=e.target.value;updatePreview();};
  const amtI=h("input",{class:"inp",type:"number",placeholder:"Importe (€)"});
  const preview=h("div",{style:{fontSize:"11px",color:"#00d4aa",marginTop:"6px",paddingLeft:"2px",minHeight:"16px"}});
  function updatePreview(){amtI.placeholder=f.type==="interest"?"Importe bruto (€)":"Importe (€)";const v=parseFloat(amtI.value);preview.textContent=f.type==="interest"&&v?`→ Neto a recibir: €${fmt(toNet(v))} (retención 19%)`:"";};
  amtI.oninput=e=>{f.amount=e.target.value;updatePreview();};
  const dateL=h("div"); dateL.appendChild(h("div",{class:"form-label"},["Fecha"]));
  const dateI=h("input",{class:"inp",type:"date",value:f.date}); dateI.oninput=e=>f.date=e.target.value; dateL.appendChild(dateI);
  const noteI=h("input",{class:"inp",placeholder:"Nota (opcional)"}); noteI.oninput=e=>f.note=e.target.value;
  const saveBtn=h("button",{class:"btn",style:{marginTop:"8px",background:p.color,color:"#070d18"},onclick:()=>{
    if(!amtI.value) return;
    p.movements.push({id:"m"+Date.now(),...f,amount:parseFloat(amtI.value)});
    currentScr="product"; render();
  }},["Guardar"]);
  [typeS,amtI,preview,dateL,noteI,saveBtn,h("div",{style:{height:"22px"}})].forEach(el=>scrl.appendChild(el));
  return scrl;
}

// ─── EDIT GOAL ────────────────────────────────────────────────────────────────
function renderEditGoal(){
  const scrl=h("div",{class:"scroll",style:{padding:"calc(20px + var(--safe-top)) 18px 0"}});
  const back=h("button",{class:"back-btn",onclick:()=>{currentScr="main";render();}});
  back.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg> Volver`;
  scrl.appendChild(back);
  scrl.appendChild(h("div",{style:{fontFamily:"'Playfair Display',serif",fontStyle:"italic",fontSize:"26px",marginBottom:"20px"}},["Editar objetivo"]));
  const nameI=h("input",{class:"inp",style:{marginBottom:"12px"},placeholder:"Nombre",value:state.goal.name});
  const targetI=h("input",{class:"inp",type:"number",placeholder:"Objetivo (€)",value:state.goal.target});
  const saveBtn=h("button",{class:"btn btn-gold",style:{marginTop:"12px"},onclick:()=>{
    state.goal.name=nameI.value||state.goal.name;
    state.goal.target=parseFloat(targetI.value)||state.goal.target;
    currentScr="main"; render();
  }},["Guardar"]);
  [nameI,targetI,saveBtn].forEach(el=>scrl.appendChild(el));
  return scrl;
}

// ─── EDIT INTEREST (cuentas ahorro) ───────────────────────────────────────────
function renderEditInterest(){
  const p=state.products.find(x=>x.id===selectedId);
  if(!p) return h("div",{},[]);
  const accGross=getAccruedSavingsGross(p);
  const scrl=h("div",{class:"scroll",style:{padding:"calc(20px + var(--safe-top)) 18px 0"}});
  const back=h("button",{class:"back-btn",onclick:()=>{currentScr="product";render();}});
  back.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg> Volver`;
  scrl.appendChild(back);
  scrl.appendChild(h("div",{style:{fontFamily:"'Playfair Display',serif",fontStyle:"italic",fontSize:"26px",marginBottom:"4px"}},["Ajustar interés"]));
  scrl.appendChild(h("div",{style:{fontSize:"12px",color:"rgba(255,255,255,0.38)",marginBottom:"20px"}},[p.name]));

  // Card info estimación
  const infoCard=h("div",{class:"card"});
  infoCard.appendChild(h("div",{class:"label",style:{marginBottom:"8px"}},["Estimación automática"]));
  const est=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"baseline"}});
  est.appendChild(h("span",{style:{fontSize:"13px",color:"rgba(255,255,255,0.5)"}},["Interés acumulado bruto"]));
  est.appendChild(h("span",{style:{fontSize:"18px",fontWeight:"700",color:"#00d4aa"}},["€"+fmt(accGross||0)]));
  infoCard.appendChild(est);
  const est2=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginTop:"6px"}});
  est2.appendChild(h("span",{style:{fontSize:"13px",color:"rgba(255,255,255,0.5)"}},["Neto (tras -19%)"]));
  est2.appendChild(h("span",{style:{fontSize:"15px",fontWeight:"700",color:"#00d4aa"}},["€"+fmt(toNet(accGross||0))]));
  infoCard.appendChild(est2);
  infoCard.appendChild(h("div",{style:{fontSize:"10px",color:"rgba(255,255,255,0.25)",marginTop:"10px",lineHeight:"1.6"}},["Calculado sobre el saldo diario al "+p.rate+"% TAE. Es una estimación; el banco puede liquidar de forma distinta."]));
  scrl.appendChild(infoCard);

  // Card override manual
  const ovCard=h("div",{class:"card"});
  ovCard.appendChild(h("div",{class:"label",style:{marginBottom:"6px"}},["Valor manual (opcional)"]));
  ovCard.appendChild(h("div",{style:{fontSize:"11px",color:"rgba(255,255,255,0.35)",marginBottom:"12px",lineHeight:"1.6"}},["Si conoces el interés bruto real que te ha pagado el banco, introdúcelo aquí y reemplazará la estimación."]));
  const ovI=h("input",{class:"inp",type:"number",placeholder:"Interés bruto real (€)",value:p.manualInterest!=null?p.manualInterest:""});
  const ovPreview=h("div",{style:{fontSize:"11px",color:"#00d4aa",marginTop:"8px",minHeight:"16px"}});
  function updOv(){const v=parseFloat(ovI.value);ovPreview.textContent=v?`→ Neto: €${fmt(toNet(v))} (tras retención 19%)`:"";}
  ovI.oninput=updOv; updOv();
  ovCard.appendChild(ovI); ovCard.appendChild(ovPreview);
  scrl.appendChild(ovCard);

  // Botones
  const saveBtn=h("button",{class:"btn btn-teal",style:{marginTop:"4px"},onclick:()=>{
    if(ovI.value==="") p.manualInterest=null;
    else p.manualInterest=parseFloat(ovI.value);
    currentScr="product"; render();
  }},["Guardar"]);
  scrl.appendChild(saveBtn);
  const clearBtn=h("button",{style:{width:"100%",marginTop:"10px",background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.1)",color:"rgba(255,255,255,0.5)",borderRadius:"13px",padding:"13px",fontSize:"13px",fontFamily:"'DM Mono',monospace",cursor:"pointer"},onclick:()=>{
    p.manualInterest=null; currentScr="product"; render();
  }},["Quitar valor manual · usar estimación"]);
  scrl.appendChild(clearBtn);
  scrl.appendChild(h("div",{style:{height:"22px"}}));
  return scrl;
}

// ─── EDIT PLAN ────────────────────────────────────────────────────────────────
function renderEditPlan(){
  let plan=(state.goal.monthlyPlan||[]).map(p=>({...p}));
  let target=state.goal.target, name=state.goal.name;
  const scrl=h("div",{class:"scroll",style:{padding:"calc(20px + var(--safe-top)) 18px 0"}});
  const back=h("button",{class:"back-btn",onclick:()=>{currentScr="main";render();}});
  back.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg> Volver`;
  scrl.appendChild(back);
  scrl.appendChild(h("div",{style:{fontFamily:"'Playfair Display',serif",fontStyle:"italic",fontSize:"26px",marginBottom:"20px"}},["Plan de ahorro"]));

  // Goal inputs
  const gc=h("div",{class:"card",style:{marginBottom:"12px"}});
  gc.appendChild(h("div",{class:"label",style:{marginBottom:"10px"}},["Objetivo"]));
  const ni=h("input",{class:"inp",style:{marginBottom:"10px"},placeholder:"Nombre",value:name}); ni.oninput=e=>name=e.target.value;
  const ti=h("input",{class:"inp",type:"number",placeholder:"Objetivo (€)",value:target}); ti.oninput=e=>target=parseFloat(e.target.value)||0;
  gc.appendChild(ni); gc.appendChild(ti); scrl.appendChild(gc);

  // Monthly rows
  const mc=h("div",{class:"card"});
  mc.appendChild(h("div",{class:"label",style:{marginBottom:"14px"}},["Aportación planificada por mes"]));
  const rowsWrap=h("div");
  function buildRows(){
    rowsWrap.innerHTML="";
    let cum=0;
    plan.forEach((p,i)=>{
      cum+=p.amount;
      const pct=Math.min((cum/target)*100,100);
      const row=h("div",{class:"plan-row"});
      row.appendChild(h("div",{class:"plan-mo"},[moLbl(p.month)]));
      const inp2=h("input",{class:"inp",type:"number",value:p.amount,style:{padding:"8px 10px",fontSize:"13px"}});
      inp2.oninput=e=>{plan[i].amount=parseFloat(e.target.value)||0;};
      inp2.onblur=buildRows;
      row.appendChild(inp2);
      const pctDiv=h("div",{class:"plan-pct"});
      pctDiv.appendChild(h("div",{style:{fontSize:"10px",color:pct>=100?"#00d4aa":"#f0b429",fontWeight:"700"}},[fmt(pct,0)+"%"]));
      pctDiv.appendChild(h("div",{style:{fontSize:"8px",color:"rgba(255,255,255,0.22)"}},[`€${(cum/1000).toFixed(1)}k`]));
      row.appendChild(pctDiv);
      const del=h("button",{style:{background:"none",border:"none",color:"rgba(255,255,255,0.2)",cursor:"pointer",padding:"2px",flexShrink:"0"},onclick:()=>{plan.splice(i,1);buildRows();}});
      del.innerHTML=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>`;
      row.appendChild(del); rowsWrap.appendChild(row);
    });
  }
  buildRows(); mc.appendChild(rowsWrap);
  const addBtn=h("button",{class:"btn btn-dashed",style:{marginTop:"12px"},onclick:()=>{
    const last=plan[plan.length-1]?.month||todayM();
    const[y,m]=last.split("-").map(Number);
    const next=m===12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,"0")}`;
    plan.push({month:next,amount:1000}); buildRows();
  }},["+ Añadir mes"]);
  mc.appendChild(addBtn); scrl.appendChild(mc);

  const saveBtn=h("button",{class:"btn btn-gold",style:{marginTop:"14px"},onclick:()=>{
    state.goal={...state.goal,name,target,monthlyPlan:plan};
    currentScr="main"; render();
  }},["Guardar plan"]);
  scrl.appendChild(saveBtn);
  scrl.appendChild(h("div",{style:{height:"22px"}}));
  return scrl;
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────────────
function render(){
  destroyCharts();
  const app=document.getElementById("app");
  app.innerHTML="";

  if(currentScr==="main"){
    const wrap=h("div",{class:"screen",style:{background:"var(--bg)"}});
    let content;
    if(currentTab==="home")    content=renderHome();
    else if(currentTab==="vencim") content=renderVencim();
    else if(currentTab==="backup") content=renderBackup();
    wrap.appendChild(content);
    wrap.appendChild(renderNav());
    app.appendChild(wrap);
  } else {
    const wrap=h("div",{class:"screen",style:{background:"var(--bg)"}});
    if(currentScr==="product")  wrap.appendChild(renderProduct());
    else if(currentScr==="addProd") wrap.appendChild(renderAddProd());
    else if(currentScr==="addMov")  wrap.appendChild(renderAddMov());
    else if(currentScr==="goal")    wrap.appendChild(renderEditGoal());
    else if(currentScr==="plan")    wrap.appendChild(renderEditPlan());
    else if(currentScr==="editInterest") wrap.appendChild(renderEditInterest());
    app.appendChild(wrap);
  }
}

render();
</script>
